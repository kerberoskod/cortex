server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuth
              args:
                excludedPaths: /api/users/register,/api/users/login

        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
          filters:
            - name: JwtAuth

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuth

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtAuth
